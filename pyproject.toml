[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-action-lab"
version = "0.1.0"
description = "A-share price action research workbench (Brooks PA); legacy core preserved, staged rework per TODO taskbook"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pal = "pal_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "bar_counting_detector",
    "focus_config",
    "market_analyzer",
    "report_signal_filter",
    "signal_predictor",
    "signal_registry",
    "strict_breakout_strength",
    "strict_pa_actionability",
    "strict_pa_detector",
    "strict_pa_qualification",
    "system_price_builder",
    "pal_cli",
    "pal_capabilities",
]
packages = ["pal", "pal.domain", "pal.signals", "pal.signals.legacy", "pal.config", "pal.data", "pal.selection", "pal.pricing", "pal.context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration -p no:cacheprovider"
markers = [
    "integration: tests requiring external/private modules not in this repo",
]
